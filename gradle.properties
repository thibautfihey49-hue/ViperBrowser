android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=34

# ⚡ COMPILATION : TOUT ACTIVÉ
org.gradle.jvmargs=-Xmx6144m -Xms3072m -XX:+UseZGC -XX:+UseStringDeduplication -XX:+OptimizeStringConcat -XX:+AggressiveOpts -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=false
org.gradle.workers.max=12
org.gradle.caching.local.directory=~/.gradle/cache

kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.compiler.execution.strategy=in-process
kotlin.compiler.opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi

# 📦 APK : SUPPRIMER TOUT CE QUI EST INUTILE
android.enableR8.fullMode=true
android.nonTransitiveRClass=true
android.nonFinalResIds=false
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.profileinstaller=false
android.defaults.buildfeatures.analytics=false
